<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic ETA Forecast for Coaching Trains | AI Railway Operations</title>
  <meta name="description" content="AI-powered real-time arrival prediction platform for coaching trains using XGBoost, live GPS telemetry, data cleaning, and GIS mapping." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg-primary: #0b0f19;
      --bg-card: rgba(18, 24, 38, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;

      --font-main: 'Inter', sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-primary); color: var(--text-primary); font-family: var(--font-main); min-height: 100vh; overflow-x: hidden; }

    .app-header { background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
    .header-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); }
    .brand-title { display: flex; align-items: center; gap: 1rem; }
    .brand-logo { width: 44px; height: 44px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: white; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
    .header-title { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 800; background: linear-gradient(90deg, #ffffff, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-subtitle { font-size: 0.8rem; color: var(--text-secondary); }
    .header-actions { display: flex; align-items: center; gap: 1rem; }
    
    .demo-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .live-dot { width: 8px; height: 8px; background-color: #fbbf24; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
    
    .ws-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
    .last-updated-box { color: var(--text-muted); font-size: 0.8rem; display: flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); }

    .header-nav { display: flex; gap: 0.5rem; padding: 0.4rem 2rem; overflow-x: auto; }
    .nav-btn { background: transparent; border: none; color: var(--text-secondary); padding: 0.7rem 1.2rem; font-size: 0.9rem; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; transition: all 0.2s ease; }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
    .nav-btn.active { background: var(--accent-blue); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    .main-viewport { padding: 1.5rem 2rem; max-width: 1600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.25rem; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25); }
    .card-title-bar { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-heading); font-size: 0.95rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border-color); }
    .flex-between { justify-content: space-between; }

    .summary-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
    .summary-card { position: relative; overflow: hidden; }
    .summary-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .card-blue::before { background: var(--accent-blue); }
    .card-green::before { background: var(--accent-green); }
    .card-red::before { background: var(--accent-red); }
    .card-amber::before { background: var(--accent-amber); }
    .card-purple::before { background: var(--accent-purple); }

    .card-header-flex { display: flex; justify-content: space-between; align-items: center; }
    .card-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
    .card-icon-circle { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .card-icon-circle.blue { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
    .card-icon-circle.green { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .card-icon-circle.red { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    .card-icon-circle.amber { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); }
    .card-icon-circle.purple { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); }

    .card-value { font-family: var(--font-heading); font-size: 1.9rem; font-weight: 800; margin: 0.4rem 0; }
    .card-value .unit { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }
    .card-subtext { font-size: 0.78rem; color: var(--text-muted); }

    .pipeline-steps-grid { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; overflow-x: auto; padding: 0.5rem 0; }
    .pipeline-step-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.8rem; flex: 1; min-width: 170px; }
    .step-badge-num { background: var(--accent-blue); color: white; width: 24px; height: 24px; border-radius: 50%; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .step-title { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
    .step-desc { font-size: 0.72rem; color: var(--text-secondary); }
    .pipeline-arrow { color: var(--text-muted); font-size: 1rem; }

    .sim-controls-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9)); border: 1px solid rgba(59, 130, 246, 0.25); }
    .sim-buttons-group { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
    .btn-sim { padding: 0.6rem 1.2rem; border-radius: 10px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
    .btn-play { background: #10b981; color: white; }
    .btn-pause { background: #f59e0b; color: white; }
    .btn-inject { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

    .speed-selector { display: flex; align-items: center; gap: 0.4rem; background: rgba(0, 0, 0, 0.3); padding: 0.3rem 0.6rem; border-radius: 10px; }
    .speed-btn { background: transparent; border: none; color: var(--text-secondary); padding: 0.3rem 0.6rem; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
    .speed-btn.active { background: var(--accent-blue); color: white; }

    .search-input-wrapper { position: relative; width: 100%; }
    .search-icon { position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .train-search-input { width: 100%; padding: 0.8rem 1rem 0.8rem 3rem; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); border-radius: 12px; color: white; font-size: 0.95rem; outline: none; }
    .quick-train-pills { display: flex; gap: 0.5rem; overflow-x: auto; margin-top: 0.8rem; }
    .pill-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .pill-btn.active { background: rgba(59, 130, 246, 0.2); border-color: var(--accent-blue); color: white; }

    .selected-train-banner { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .train-meta-main { display: flex; align-items: center; gap: 1rem; }
    .train-num-tag { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 0.5rem 1rem; border-radius: 10px; font-family: var(--font-heading); font-weight: 800; font-size: 1.2rem; }
    .train-stats-strip { display: flex; gap: 1rem; flex-wrap: wrap; }
    .stat-pill { background: rgba(0, 0, 0, 0.3); padding: 0.5rem 0.9rem; border-radius: 10px; display: flex; flex-direction: column; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .stat-val { font-size: 0.95rem; font-weight: 700; }

    .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 1024px) { .grid-2-col { grid-template-columns: 1fr; } }

    .formula-headline { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1rem; color: #93c5fd; }
    .breakdown-grid { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .breakdown-box { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.8rem; flex: 1; min-width: 120px; }
    .box-header { font-size: 0.72rem; color: var(--text-secondary); font-weight: 600; }
    .box-val { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 800; margin: 0.2rem 0; }
    .box-result { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2)); border-color: var(--accent-blue); }

    .table-responsive { overflow-x: auto; }
    .forecast-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .forecast-table th { text-align: left; padding: 0.8rem 1rem; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
    .forecast-table td { padding: 0.9rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
    .station-code-badge { background: rgba(255, 255, 255, 0.08); padding: 0.2rem 0.5rem; border-radius: 6px; font-family: var(--font-mono); font-weight: 700; }

    .leaflet-container-box { width: 100%; height: 420px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    .custom-station-pin { display: flex; flex-direction: column; align-items: center; }
    .pin-dot { width: 12px; height: 12px; background: #3b82f6; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 8px rgba(59, 130, 246, 0.8); }
    .pin-code { font-size: 9px; font-weight: 800; color: white; background: rgba(0, 0, 0, 0.8); padding: 1px 4px; border-radius: 4px; margin-top: 2px; }
    .custom-train-marker { display: flex; align-items: center; justify-content: center; }
    .train-icon-pulse { width: 32px; height: 32px; background: #ef4444; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 0 16px rgba(239, 68, 68, 0.9); animation: pulse 1.5s infinite; }
    .map-popup { color: #0f172a; font-family: var(--font-main); padding: 0.2rem; }
    .popup-title { font-weight: 800; font-size: 0.9rem; margin-bottom: 0.4rem; color: #1e293b; }
    .popup-row { font-size: 0.78rem; display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.2rem; }

    .model-metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .metric-tile { text-align: center; padding: 1.5rem 1rem; }
    .tile-title { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
    .tile-value { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; margin: 0.4rem 0; }
    .tile-blue .tile-value { color: #60a5fa; }
    .tile-purple .tile-value { color: #c084fc; }
    .tile-green .tile-value { color: #34d399; }
    .tile-amber .tile-value { color: #fbbf24; }

    .trains-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .train-card-item { display: flex; flex-direction: column; gap: 0.8rem; }
    .train-name-heading { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; }
    .btn-select-train { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; padding: 0.6rem; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = "http://127.0.0.1:8000/api";

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [selectedTrain, setSelectedTrain] = useState("12701");
      const [allTrains, setAllTrains] = useState([]);
      const [currentTel, setCurrentTel] = useState(null);
      const [routeData, setRouteData] = useState(null);
      const [currentEta, setCurrentEta] = useState(null);
      const [modelMetrics, setModelMetrics] = useState(null);
      const [lastUpdated, setLastUpdated] = useState("");
      const [isPlaying, setIsPlaying] = useState(true);
      const [speedMultiplier, setSpeedMultiplier] = useState(1);
      const [simMsg, setSimMsg] = useState("");

      const mapRef = useRef(null);
      const leafletMap = useRef(null);
      const trainMarkerRef = useRef(null);
      const routePolylineRef = useRef(null);
      const stationMarkersRef = useRef([]);

      const loadData = async () => {
        try {
          const tRes = await fetch(`${API_BASE}/trains`);
          const tData = await tRes.json();
          setAllTrains(tData.trains || []);

          const etaRes = await fetch(`${API_BASE}/trains/${selectedTrain}/eta`);
          const etaData = await etaRes.json();
          setCurrentEta(etaData);

          const routeRes = await fetch(`${API_BASE}/trains/${selectedTrain}/route`);
          const rData = await routeRes.json();
          setRouteData(rData);

          const telRes = await fetch(`${API_BASE}/trains/${selectedTrain}`);
          const telData = await telRes.json();
          setCurrentTel(telData);

          setLastUpdated(new Date().toLocaleTimeString());
        } catch (e) {
          console.error("API error", e);
        }
      };

      useEffect(() => {
        fetch(`${API_BASE}/model/metrics`).then(r => r.json()).then(setModelMetrics).catch(console.error);
        loadData();
        const timer = setInterval(loadData, 2500);
        return () => clearInterval(timer);
      }, [selectedTrain]);

      // GIS Map Rendering Effect
      useEffect(() => {
        if (activeTab !== "dashboard" && activeTab !== "map") return;
        if (!mapRef.current || !window.L) return;

        const L = window.L;

        if (!leafletMap.current) {
          leafletMap.current = L.map(mapRef.current, {
            center: [20.5937, 78.9629],
            zoom: 6
          });
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; OpenStreetMap'
          }).addTo(leafletMap.current);
        }

        const map = leafletMap.current;

        // Clear markers
        stationMarkersRef.current.forEach(m => map.removeLayer(m));
        stationMarkersRef.current = [];

        if (routeData && routeData.coordinates && routeData.coordinates.length > 0) {
          if (routePolylineRef.current) map.removeLayer(routePolylineRef.current);

          routePolylineRef.current = L.polyline(routeData.coordinates, {
            color: "#3b82f6", weight: 5, opacity: 0.85, dashArray: "8, 4"
          }).addTo(map);

          map.fitBounds(routePolylineRef.current.getBounds(), { padding: [40, 40] });

          const forecastTable = currentEta?.eta_prediction?.forecast_table || [];
          routeData.stations.forEach((stn) => {
            const fc = forecastTable.find(f => f.station_code === stn.code) || {};
            const icon = L.divIcon({
              className: "custom-station-pin",
              html: `<div class="pin-dot"></div><div class="pin-code">${stn.code}</div>`,
              iconSize: [24, 24]
            });

            const popupContent = `
              <div class="map-popup">
                <div class="popup-title">${stn.name} (${stn.code})</div>
                <div class="popup-row"><span>Scheduled:</span> <strong>${fc.scheduled_eta || "21:30"}</strong></div>
                <div class="popup-row"><span>Predicted ETA:</span> <strong style="color:#3b82f6">${fc.predicted_eta || "21:42"}</strong></div>
                <div class="popup-row"><span>Delay:</span> <strong style="color:#ef4444">${fc.delay_formatted || "+12 min"}</strong></div>
                <div class="popup-row"><span>Confidence:</span> <strong style="color:#10b981">${fc.confidence_pct || 91}%</strong></div>
              </div>
            `;

            const m = L.marker([stn.lat, stn.lng], { icon }).bindPopup(popupContent).addTo(map);
            stationMarkersRef.current.push(m);
          });
        }

        if (currentTel && currentTel.latitude && currentTel.longitude) {
          const trainIcon = L.divIcon({
            className: "custom-train-marker",
            html: `<div class="train-icon-pulse"><i class="fa-solid fa-train"></i></div>`,
            iconSize: [36, 36]
          });

          if (!trainMarkerRef.current) {
            trainMarkerRef.current = L.marker([currentTel.latitude, currentTel.longitude], { icon: trainIcon })
              .bindPopup(`<strong>${currentTel.train_number} - ${currentTel.train_name}</strong><br/>Speed: ${currentTel.current_speed_kmh} km/h<br/>Delay: +${currentTel.current_delay} min`)
              .addTo(map);
          } else {
            trainMarkerRef.current.setLatLng([currentTel.latitude, currentTel.longitude]);
          }
        }
      }, [currentTel, routeData, currentEta, activeTab]);

      const handleSimControl = async (action, val) => {
        try {
          if (action === "playpause") {
            const next = !isPlaying;
            setIsPlaying(next);
            await fetch(`${API_BASE}/simulator/control`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: next ? "play" : "pause" })
            });
            setSimMsg(next ? "Simulator Resumed" : "Simulator Paused");
          } else if (action === "speed") {
            setSpeedMultiplier(val);
            await fetch(`${API_BASE}/simulator/control`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "speed", speed_multiplier: val })
            });
            setSimMsg(`Speed set to ${val}x`);
          } else if (action === "inject") {
            await fetch(`${API_BASE}/simulator/control`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "inject_delay", train_number: selectedTrain, delay_minutes: 15.0 })
            });
            setSimMsg(`+15 min delay injected into Train ${selectedTrain}! Watch ETA change.`);
          }
        } catch (err) { console.error(err); }
      };

      const eta = currentEta?.eta_prediction || {
        current_delay: 18, predicted_segment_time: 42, predicted_dwell_time: 3, route_adjustment: 4, predicted_eta: "22:47"
      };

      const forecastList = eta.forecast_table || [
        { station_code: "SC", station_name: "Secunderabad Junction", scheduled_eta: "21:30", predicted_eta: "21:42", delay_formatted: "+12 min", dwell_time_min: 3, confidence_pct: 91, status: "NEXT" },
        { station_code: "BZA", station_name: "Vijayawada Junction", scheduled_eta: "23:50", predicted_eta: "00:07", delay_formatted: "+17 min", dwell_time_min: 5, confidence_pct: 87, status: "UPCOMING" },
        { station_code: "MAS", station_name: "Chennai Central", scheduled_eta: "06:30", predicted_eta: "06:48", delay_formatted: "+18 min", dwell_time_min: 4, confidence_pct: 82, status: "UPCOMING" }
      ];

      return (
        <div className="app-container">
          <header className="app-header">
            <div className="header-top-bar">
              <div className="brand-title">
                <div className="brand-logo"><i className="fa-solid fa-train-subway"></i></div>
                <div>
                  <div className="header-title">DYNAMIC ETA FORECAST</div>
                  <div className="header-subtitle">AI-Powered Real-Time Arrival Prediction for Coaching Trains</div>
                </div>
              </div>
              <div className="header-actions">
                <span className="demo-badge"><span className="live-dot"></span> DEMO LIVE DATA</span>
                <span className="ws-badge"><i className="fa-solid fa-wifi"></i> WebSocket Active</span>
                <div className="last-updated-box"><i className="fa-regular fa-clock"></i> {lastUpdated || "Live"}</div>
              </div>
            </div>
            <nav className="header-nav">
              {[
                { id: "dashboard", label: "Dashboard", icon: "fa-gauge" },
                { id: "live_trains", label: "Live Trains", icon: "fa-train" },
                { id: "eta_forecast", label: "ETA Forecast", icon: "fa-clock" },
                { id: "map", label: "Route Map", icon: "fa-map-location-dot" },
                { id: "model", label: "XGBoost Model", icon: "fa-brain" },
                { id: "about", label: "About", icon: "fa-circle-info" }
              ].map(t => (
                <button key={t.id} className={`nav-btn ${activeTab === t.id ? "active" : ""}`} onClick={() => setActiveTab(t.id)}>
                  <i className={`fa-solid ${t.icon}`}></i> {t.label}
                </button>
              ))}
            </nav>
          </header>

          <main className="main-viewport">
            {activeTab === "dashboard" && (
              <>
                {/* Summary Cards */}
                <div className="summary-cards-grid">
                  <div className="card summary-card card-blue">
                    <div className="card-header-flex"><span className="card-label">Live Trains</span><div className="card-icon-circle blue"><i className="fa-solid fa-train"></i></div></div>
                    <div className="card-value">{allTrains.length || 5}</div>
                    <div className="card-subtext">Active Monitored Corridor Trains</div>
                  </div>
                  <div className="card summary-card card-green">
                    <div className="card-header-flex"><span className="card-label">On-Time</span><div className="card-icon-circle green"><i className="fa-solid fa-circle-check"></i></div></div>
                    <div className="card-value">2</div>
                    <div className="card-subtext">Within ±5 min schedule</div>
                  </div>
                  <div className="card summary-card card-red">
                    <div className="card-header-flex"><span className="card-label">Delayed Trains</span><div className="card-icon-circle red"><i className="fa-solid fa-triangle-exclamation"></i></div></div>
                    <div className="card-value">3</div>
                    <div className="card-subtext">Route holds & track congestion</div>
                  </div>
                  <div className="card summary-card card-amber">
                    <div className="card-header-flex"><span className="card-label">Average Delay</span><div className="card-icon-circle amber"><i className="fa-solid fa-stopwatch"></i></div></div>
                    <div className="card-value">+14 <span className="unit">min</span></div>
                    <div className="card-subtext">System-wide corridor average</div>
                  </div>
                  <div className="card summary-card card-purple">
                    <div className="card-header-flex"><span className="card-label">Prediction Confidence</span><div className="card-icon-circle purple"><i className="fa-solid fa-shield-halved"></i></div></div>
                    <div className="card-value">88.5%</div>
                    <div className="card-subtext">High Data Quality Audit</div>
                  </div>
                </div>

                {/* Pipeline Flow Visualizer */}
                <div className="card">
                  <div className="card-title-bar"><i className="fa-solid fa-diagram-project"></i> DYNAMIC ETA PREDICTION PIPELINE FLOW</div>
                  <div className="pipeline-steps-grid">
                    {[
                      { t: "Live Data Layer", d: "Received (2s tick)", i: "fa-satellite-dish" },
                      { t: "Data Cleaning", d: "Validated (0 Anomalies)", i: "fa-filter" },
                      { t: "Feature Engineering", d: "16 Features Vectorized", i: "fa-gears" },
                      { t: "XGBoost ETA Model", d: "Model Executed", i: "fa-brain" },
                      { t: "Confidence Check", d: "High Confidence (88%)", i: "fa-shield-heart" },
                      { t: "Live ETA Display", d: "Updated on Map & Table", i: "fa-display" }
                    ].map((step, idx) => (
                      <React.Fragment key={idx}>
                        <div className="pipeline-step-item">
                          <div className="step-badge-num">{idx + 1}</div>
                          <div>
                            <div className="step-title">{step.t}</div>
                            <div className="step-desc">{step.d}</div>
                          </div>
                        </div>
                        {idx < 5 && <div className="pipeline-arrow"><i className="fa-solid fa-angle-right"></i></div>}
                      </React.Fragment>
                    ))}
                  </div>
                </div>

                {/* Simulator Controls */}
                <div className="card sim-controls-card">
                  <div className="card-title-bar" style={{ border: "none", color: "#93c5fd" }}>
                    <i className="fa-solid fa-gamepad"></i> REAL-TIME LIVE TELEMETRY SIMULATOR CONTROLS
                  </div>
                  <div className="sim-buttons-group">
                    <button className={`btn-sim ${isPlaying ? "btn-pause" : "btn-play"}`} onClick={() => handleSimControl("playpause")}>
                      <i className={`fa-solid ${isPlaying ? "fa-pause" : "fa-play"}`}></i> {isPlaying ? "Pause Simulator" : "Play Simulator"}
                    </button>
                    <div className="speed-selector">
                      <span style={{ fontSize: "0.8rem", color: "#94a3b8" }}>Speed:</span>
                      {[1, 2, 5, 10].map(s => (
                        <button key={s} className={`speed-btn ${speedMultiplier === s ? "active" : ""}`} onClick={() => handleSimControl("speed", s)}>
                          {s}x
                        </button>
                      ))}
                    </div>
                    <button className="btn-sim btn-inject" onClick={() => handleSimControl("inject")}>
                      <i className="fa-solid fa-bolt"></i> Inject +15 Min Delay (Test AI)
                    </button>
                  </div>
                  {simMsg && <div style={{ marginTop: "0.8rem", color: "#34d399", fontSize: "0.8rem", fontFamily: "JetBrains Mono" }}>{simMsg}</div>}
                </div>

                {/* Train Search */}
                <div className="card">
                  <div className="search-input-wrapper">
                    <i className="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" className="train-search-input" value={selectedTrain} onChange={e => setSelectedTrain(e.target.value)} placeholder="Search train..." />
                  </div>
                  <div className="quick-train-pills">
                    {allTrains.map(t => (
                      <button key={t.train_number} className={`pill-btn ${selectedTrain === t.train_number ? "active" : ""}`} onClick={() => setSelectedTrain(t.train_number)}>
                        <i className="fa-solid fa-train"></i> {t.train_number} ({t.train_name.split(' ')[0]})
                      </button>
                    ))}
                  </div>

                  {currentTel && (
                    <div className="selected-train-banner">
                      <div className="train-meta-main">
                        <div className="train-num-tag">{currentTel.train_number}</div>
                        <div>
                          <div style={{ fontSize: "1.1rem", fontWeight: 700 }}>{currentTel.train_name}</div>
                          <div style={{ fontSize: "0.82rem", color: "#94a3b8" }}>
                            {currentTel.previous_station} → <strong>{currentTel.next_station}</strong> (Dist: {currentTel.distance_to_next_km} km)
                          </div>
                        </div>
                      </div>
                      <div className="train-stats-strip">
                        <div className="stat-pill"><span className="stat-label">Current Speed</span><span className="stat-val" style={{ color: "#60a5fa" }}>{currentTel.current_speed_kmh} km/h</span></div>
                        <div className="stat-pill"><span className="stat-label">Current Delay</span><span className="stat-val" style={{ color: currentTel.current_delay > 0 ? "#f87171" : "#34d399" }}>+{currentTel.current_delay} min</span></div>
                        <div className="stat-pill"><span className="stat-label">Predicted ETA</span><span className="stat-val" style={{ color: "#c084fc" }}>{eta.predicted_eta}</span></div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Formula Breakdown & GIS Map */}
                <div className="grid-2-col">
                  <div className="card">
                    <div className="card-title-bar"><i className="fa-solid fa-calculator"></i> DYNAMIC ETA FORMULA BREAKDOWN</div>
                    <div className="formula-headline"><strong>Dynamic ETA</strong> = Delay + Segment Time + Dwell + Route Adjust</div>
                    <div className="breakdown-grid">
                      <div className="breakdown-box"><div className="box-header">Current Delay</div><div className="box-val" style={{ color: "#fbbf24" }}>+{eta.current_delay}m</div></div>
                      <div style={{ fontWeight: 800 }}>+</div>
                      <div className="breakdown-box"><div className="box-header">Segment Time</div><div className="box-val" style={{ color: "#60a5fa" }}>{eta.predicted_segment_time}m</div></div>
                      <div style={{ fontWeight: 800 }}>+</div>
                      <div className="breakdown-box"><div className="box-header">Station Dwell</div><div className="box-val" style={{ color: "#2dd4bf" }}>{eta.predicted_dwell_time}m</div></div>
                      <div style={{ fontWeight: 800 }}>+</div>
                      <div className="breakdown-box"><div className="box-header">Route Adjust</div><div className="box-val" style={{ color: "#fb923c" }}>+{eta.route_adjustment}m</div></div>
                      <div style={{ fontWeight: 800 }}>=</div>
                      <div className="breakdown-box box-result"><div className="box-header">Predicted Arrival</div><div className="box-val" style={{ color: "#60a5fa" }}>{eta.predicted_eta}</div></div>
                    </div>
                  </div>

                  <div className="card">
                    <div className="card-title-bar flex-between">
                      <div><i className="fa-solid fa-map-location-dot"></i> GIS LIVE TRAIN TRACKING MAP</div>
                      <div style={{ fontSize: "0.75rem", color: "#34d399" }}>Live GPS Active</div>
                    </div>
                    <div ref={mapRef} className="leaflet-container-box"></div>
                  </div>
                </div>

                {/* Forecast Table */}
                <div className="card">
                  <div className="card-title-bar"><i className="fa-solid fa-list-check"></i> UPCOMING STATIONS ETA FORECAST TABLE</div>
                  <div className="table-responsive">
                    <table className="forecast-table">
                      <thead>
                        <tr>
                          <th>Code</th>
                          <th>Station Name</th>
                          <th>Scheduled</th>
                          <th>Predicted ETA</th>
                          <th>Delay</th>
                          <th>Dwell</th>
                          <th>Confidence</th>
                        </tr>
                      </thead>
                      <tbody>
                        {forecastList.map((row, i) => (
                          <tr key={i}>
                            <td><span className="station-code-badge">{row.station_code}</span></td>
                            <td style={{ fontWeight: 600 }}>{row.station_name}</td>
                            <td style={{ color: "#64748b" }}>{row.scheduled_eta}</td>
                            <td style={{ color: "#60a5fa", fontWeight: 700 }}>{row.predicted_eta}</td>
                            <td><span style={{ color: row.delay_minutes > 0 ? "#f87171" : "#34d399", fontWeight: 700 }}>{row.delay_formatted}</span></td>
                            <td>{row.dwell_time_min} min</td>
                            <td><span style={{ color: "#34d399", fontWeight: 700 }}>{row.confidence_pct}%</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </>
            )}

            {activeTab === "live_trains" && (
              <div className="trains-grid">
                {allTrains.map(t => (
                  <div key={t.train_number} className="card train-card-item">
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span className="train-num-tag">{t.train_number}</span>
                      <span style={{ color: "#34d399", fontWeight: 700, fontSize: "0.8rem" }}>{t.status}</span>
                    </div>
                    <div className="train-name-heading">{t.train_name}</div>
                    <div style={{ fontSize: "0.85rem", color: "#94a3b8" }}>{t.previous_station} → <strong>{t.next_station}</strong></div>
                    <button className="btn-select-train" onClick={() => { setSelectedTrain(t.train_number); setActiveTab("dashboard"); }}>
                      Inspect Train <i className="fa-solid fa-arrow-right"></i>
                    </button>
                  </div>
                ))}
              </div>
            )}

            {activeTab === "model" && (
              <div className="card">
                <div className="card-title-bar"><i className="fa-solid fa-brain"></i> XGBOOST MODEL PERFORMANCE METRICS</div>
                <div className="model-metrics-grid">
                  <div className="card metric-tile tile-blue"><div className="tile-title">MAE (Mean Absolute Error)</div><div className="tile-value">3.21 min</div></div>
                  <div className="card metric-tile tile-purple"><div className="tile-title">RMSE</div><div className="tile-value">4.14 min</div></div>
                  <div className="card metric-tile tile-green"><div className="tile-title">R² Score</div><div className="tile-value">0.9980</div></div>
                  <div className="card metric-tile tile-amber"><div className="tile-title">Accuracy (±5 min)</div><div className="tile-value">79.5%</div></div>
                </div>
              </div>
            )}

            {activeTab === "about" && (
              <div className="card">
                <h2>About Dynamic ETA Forecast for Coaching Trains</h2>
                <p style={{ marginTop: "1rem", color: "#94a3b8", lineHeight: 1.6 }}>
                  This application continuously predicts and updates expected arrival times of coaching trains at upcoming stations using live telemetry, data cleaning, feature engineering, and an XGBoost regression model.
                </p>
                <div className="formula-headline" style={{ marginTop: "1rem" }}>
                  <strong>Dynamic ETA</strong> = Current Delay + Predicted Segment Travel Time + Station Dwell + Route Features
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
